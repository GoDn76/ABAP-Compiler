[package]
name = "abapc-studio"
version = "5.0.1"
edition = "2021"

[[bin]]
name = "abapc-server"
path = "src/main.rs"

[lib]
name = "abapc_studio"
path = "src/lib.rs"

[dependencies]
axum = { version = "0.7", features = ["macros"] }
tokio = { version = "1.38", features = ["full"] }
tower = { version = "0.4", features = ["util"] }
tower-http = { version = "0.5", features = ["fs", "cors", "trace", "limit"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
dotenvy = "0.15"
envconfig = "0.10"
chrono = { version = "0.4", features = ["serde"] }
regex = "1.10"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
async-trait = "0.1"
parking_lot = "0.12"
sqlx = { version = "0.7", default-features = false, features = ["runtime-tokio-rustls", "postgres", "macros", "json"], optional = true }
redis = { version = "0.25", default-features = false, features = ["tokio-comp", "connection-manager", "aio"], optional = true }

[features]
default = []
database = ["dep:sqlx", "dep:redis"]

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
panic = "abort"
strip = true
