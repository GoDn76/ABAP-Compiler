version: '3.8'

services:
  abapc-server:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: abapc_studio_server
    ports:
      - "7345:7345"
    environment:
      - ABAPC_PORT=7345
      - ABAPC_HOST=0.0.0.0
      - ABAPC_NO_BROWSER=1
      - RUST_LOG=info
      # Connect to host Redis (running on server outside Docker)
      - REDIS_URL=redis://host.docker.internal:6379/0
      # Optional: default DB or use BYODB in UI
      - DATABASE_URL=postgres://postgres:password@host.docker.internal:5432/postgres
      # Rate Limiting (RPS / RPM config):
      # RATE_LIMIT_MAX_REQUESTS: max requests per IP (0 disables rate limiting)
      # RATE_LIMIT_WINDOW_SECS: window in seconds (set to 1 for Requests Per Second, 60 for RPM)
      - RATE_LIMIT_MAX_REQUESTS=300
      - RATE_LIMIT_WINDOW_SECS=60
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ./executed codes:/app/executed codes
      - ./runtime:/app/runtime

